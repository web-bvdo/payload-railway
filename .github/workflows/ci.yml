# CI van deze site. De inhoud staat centraal in de template, zodat een CI-wijziging
# meteen voor alle sites geldt (geen PR per site): web-bvdo/payload-railway,
# .github/workflows/payload-ci.yml, branch ci-v1. Pas dit bestand niet per site aan.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: web-bvdo/payload-railway/.github/workflows/payload-ci.yml@ci-v1
    permissions:
      actions: write
      contents: write
      pull-requests: write
