# Dependabot voor een Payload + Next.js site.
#
# Security-updates: komen direct binnen zodra er een advisory is (los van het
# schema hieronder en zonder cooldown), en mergen automatisch bij groene CI.
# Versie-updates: wekelijks, pas 3 dagen na release (bescherming tegen
# gecompromitteerde pakketten), gegroepeerd om ruis te beperken.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Majors die bewust vastliggen (security-updates komen wél door):
    ignore:
      - dependency-name: graphql # Payload vereist graphql ^16
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node' # volgt .nvmrc (Node 22)
        update-types: ['version-update:semver-major']
      - dependency-name: typescript # TS 7 faalt in CI (PR #10); apart oppakken
        update-types: ['version-update:semver-major']
    groups:
      # Security-updates: samenhangende pakketten in één PR, zodat Payload-
      # pakketten niet uit de pas raken.
      payload-security:
        applies-to: security-updates
        patterns: ['payload', '@payloadcms/*']
      nextjs-security:
        applies-to: security-updates
        patterns: ['next', '@next/*', 'eslint-config-next']
      react-security:
        applies-to: security-updates
        patterns: ['react', 'react-dom', 'react-server-dom-*']

      # Versie-updates: de eerste groep die past wint.
      payload:
        applies-to: version-updates
        patterns: ['payload', '@payloadcms/*']
      nextjs:
        applies-to: version-updates
        patterns: ['next', '@next/*', 'eslint-config-next']
      react:
        applies-to: version-updates
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      overige-minor-en-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    groups:
      github-actions:
        patterns: ['*']
